name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run POSIX shell and AWK tests
        shell: sh
        run: make check
      - name: Check tagged release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: sh
        run: make release-check
