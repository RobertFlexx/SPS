name: notify-site

on:
  release:
    types: [published, edited]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request Splux site rebuild
        env:
          GH_TOKEN: ${{ secrets.SPLUX_SITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            printf '%s\n' "SPLUX_SITE_TOKEN unset; splux-site rebuilds every five minutes and the news page also reads GitHub in the browser"
            exit 0
          fi
          gh api --method POST repos/RobertFlexx/splux-site/dispatches \
            -f event_type=rebuild
