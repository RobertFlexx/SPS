# Basic SPS configuration. Paths below are relative to SPS_ROOT unless an
# environment variable overrides them.
db /var/lib/sps
cache /var/cache/sps
build /var/tmp/sps
repo_root /usr/src/sps
makejobs auto
cflags -O2 -pipe
cxxflags -O2 -pipe
march native
compression auto
preserve etc

# Leave arch unset to use `uname -m`.
# march none disables adding -march= to CFLAGS/CXXFLAGS.
# cppflags and ldflags occupy the rest of the line the same way cflags does.
