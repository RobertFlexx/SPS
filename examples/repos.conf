# Formats:
# git NAME SOURCE [PRIORITY]
# dir NAME ABSOLUTE_PATH [PRIORITY]
#
# Official repositories are cloned below repo_root/NAME. Local trees are
# indexed in place. Higher priority wins. setup and mkiso write active
# core and extra lines. Community is a comment only until you add it.
#
# dir local /usr/local/src/sps-local 200
# git core https://github.com/RobertFlexx/sps-core.git 100
# git extra https://github.com/RobertFlexx/sps-extra.git 80
#
# Community recipes are not enabled by default.
# git community https://github.com/RobertFlexx/sps-community.git 50
